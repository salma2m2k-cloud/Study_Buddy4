name: study_buddy
description: "Study Buddy — a local-first productivity app for students."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6

  # State management
  provider: ^6.1.2

  # Local persistence
  shared_preferences: ^2.2.3

  # Normal scheduled task notifications
  flutter_local_notifications: ^17.2.2

  # Timezone-aware scheduling
  timezone: ^0.9.4
  flutter_timezone: ^5.1.0

  # Notification / exact alarm permissions
  permission_handler: ^11.3.1

  # Real looping class alarms
  alarm: ^5.1.5

  # IDs
  uuid: ^4.4.0

  # Date formatting
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/class_alarm.mp3
